<script>
  var skillData = {
    karate: { icon: '🥋', img: 'assets/images/karate.jpg',
      role: { zh: '🥋 空手道', en: '🥋 Karate', ja: '🥋 空手' },
      title: { zh: '不只是練習，更是一次次站上擂台', en: 'Not just practice — stepping into the ring again and again', ja: '練習だけでなく、何度もリングに立ってきた' },
      desc: { zh: '我拿過好幾面空手道金牌，但比起獎牌，我更喜歡比賽教我的事：怎麼在壓力下保持專注、怎麼在輸掉之後重新站起來。這些練習出來的韌性，也是我後來能帶領不落蒂聯盟走過低潮的原因。', en: "I've won several karate gold medals, but more than the medals, I love what competing has taught me: staying focused under pressure, and getting back up after a loss. That resilience is also why I've been able to lead the No Butts Alliance through hard times.", ja: '空手でいくつも金メダルを獲得しましたが、メダルより好きなのは試合が教えてくれたこと——プレッシャーの中で集中力を保つこと、負けた後にまた立ち上がることです。この試合で鍛えた粘り強さが、後に不落蒂聯盟を低迷期から導けた理由でもあります。' } },
    sailing: { icon: '⛵', img: 'assets/images/speaking.jpg',
      role: { zh: '⛵ 帆船', en: '⛵ Sailing', ja: '⛵ セーリング' },
      title: { zh: '帆船選手', en: 'Competitive sailor', ja: 'セーリング選手' },
      desc: { zh: '我是宜蘭帆船隊的選手，長期接受帆船訓練與比賽。這種對海洋的親近感，也讓我更在意菸蒂如何汙染水源這件事。', en: 'I sail competitively with the Yilan Sailing Team, training and racing long-term. That closeness to the ocean is part of why I care so much about how cigarette butts pollute our waters.', ja: '宜蘭セーリングチームの選手として、長期的にトレーニングと大会に参加しています。海への親しみが、タバコの吸い殻が水源を汚染することへの関心にもつながっています。' } },
    training: { icon: '🚣', img: 'assets/images/training.jpg',
      role: { zh: '🚣 重量訓練', en: '🚣 Strength training', ja: '🚣 筋力トレーニング' },
      title: { zh: '把身體練起來，也把耐力練起來', en: 'Building both strength and endurance', ja: '体力と持久力を鍛える' },
      desc: { zh: '划船機、重量訓練是我平常維持體力的方式——尤其是準備空手道比賽或北極科學考察這類需要體力的行動之前。', en: 'Rowing machine and strength training are how I stay in shape day to day — especially before something physically demanding like a karate competition or the Arctic expedition.', ja: 'ローイングマシンや筋力トレーニングは日頃の体力維持の方法です——特に空手の試合や北極科学調査など、体力が必要な活動の前に行います。' } },
    unicycle: { icon: '🎪', img: null,
      role: { zh: '🎪 獨輪車', en: '🎪 Unicycle', ja: '🎪 一輪車' },
      title: { zh: '還在練習中的新技能', en: 'A new skill still in progress', ja: 'まだ練習中の新しいスキル' },
      desc: { zh: '我已經練習了兩年。', en: "I've been practicing for two years.", ja: 'もう2年間練習しています。' } },
    staffdance: { icon: '🥢', img: 'assets/images/staffdance.jpg', igVideo: 'https://www.instagram.com/reel/DZjE4EFhc0d/',
      role: { zh: '🥢 棍舞', en: '🥢 Staff dance', ja: '🥢 棍舞（棒踊り）' },
      title: { zh: '傳統棍舞表演', en: 'Traditional staff dance performance', ja: '伝統的な棒踊りの披露' },
      desc: { zh: '除了空手道，我也學了棍舞，在成果發表會上穿著傳統服裝上台表演過。', en: 'Besides karate, I also learned staff dance, and performed it on stage in traditional costume at a school showcase.', ja: '空手のほかに棍舞（棒を使った伝統舞踊）も習っていて、発表会で伝統衣装を着て舞台に立ったことがあります。' } },
    basketball: { icon: '🏀', img: null,
      role: { zh: '🏀 籃球', en: '🏀 Basketball', ja: '🏀 バスケットボール' },
      title: { zh: '課餘常打的球類運動', en: 'A sport I often play in my free time', ja: 'よく遊ぶスポーツの一つ' },
      desc: { zh: '下課或假日常跟同學打籃球，是我除了空手道以外另一個放電的方式。', en: "I often play basketball with classmates after school or on weekends — it's another way I burn off energy besides karate.", ja: '放課後や休日によくクラスメートとバスケットボールをします。空手以外にエネルギーを発散するもう一つの方法です。' } },
    volleyball: { icon: '🏐', img: null,
      role: { zh: '🏐 排球', en: '🏐 Volleyball', ja: '🏐 バレーボール' },
      title: { zh: '課餘常打的球類運動', en: 'A sport I often play in my free time', ja: 'よく遊ぶスポーツの一つ' },
      desc: { zh: '排球也是我常打的球類運動之一，喜歡團隊一起配合、來回攻防的節奏。', en: 'Volleyball is another sport I play often — I like the teamwork and the back-and-forth rhythm of the game.', ja: 'バレーボールもよくするスポーツの一つです。チームで息を合わせて攻守を繰り返すリズムが好きです。' } },
    sow: { icon: '🌿', img: null,
      role: { zh: '🌿 荒野保護協會（SOW）', en: '🌿 Society of Wilderness (SOW)', ja: '🌿 荒野保護協会（SOW）' },
      title: { zh: '愛上自然的起點', en: 'Where my love of nature began', ja: '自然を愛するようになった原点' },
      desc: { zh: '從 5 歲加入到現在，已經是第 9 年的夥伴。這段旅程讓我真正愛上自然，也是我想保護環境最早的起點。', en: "I've been a member since I was 5 — now in my 9th year. This journey is what made me truly fall in love with nature, and it's the earliest root of my wish to protect the environment.", ja: '5歳の頃から参加していて、今年で9年目のメンバーです。この経験を通じて本当に自然を愛するようになり、環境を守りたいという想いの原点にもなっています。' } },
    scouts: { icon: '🏕️', img: 'assets/images/scout2.jpg',
      role: { zh: '🏕️ 童軍團隊長', en: '🏕️ Scout troop leader', ja: '🏕️ ボーイスカウト隊長' },
      title: { zh: '學會帶著一群人完成任務', en: 'Learning to lead a team to get things done', ja: 'チームをまとめて物事を成し遂げる力を学んだ' },
      desc: { zh: '國中時加入童軍，並擔任隊長。學會野外求生技巧、也學會怎麼帶著一群人一起完成任務——這些能力後來都用在帶領不落蒂聯盟上。', en: 'I joined scouts in junior high and became troop leader. I learned wilderness survival skills and how to lead a group to complete tasks together — abilities I later used to lead the No Butts Alliance.', ja: '中学でボーイスカウトに加わり、隊長を務めました。野外生存技術だけでなく、みんなをまとめて任務を達成する方法も学び、その力は後に不落蒂聯盟を率いる際にも役立ちました。' } },
    trip: { icon: '🧭', img: null,
      role: { zh: '🧭 壯遊與環島', en: '🧭 Grand journeys & round-island trips', ja: '🧭 壮遊と台湾一周' },
      title: { zh: '在路上學習、在挑戰裡成長', en: 'Learning on the road, growing through challenges', ja: '旅の中で学び、挑戦の中で成長する' },
      desc: { zh: '參加過基隆、台中等地的小隊壯遊行動，也完成過環島壯遊，喜歡在路上學習、在挑戰裡成長。', en: "I've taken part in small-group grand journeys in places like Keelung and Taichung, and completed a round-island trip. I love learning on the road and growing through challenges.", ja: '基隆や台中などでの班別壮遊活動に参加し、台湾一周の壮遊も達成しました。旅の中で学び、挑戦の中で成長するのが好きです。' } },
    hp: { icon: '⚡', img: null,
      role: { zh: '⚡ 哈利波特', en: '⚡ Harry Potter', ja: '⚡ ハリー・ポッター' },
      title: { zh: '《哈利波特》全系列', en: 'The complete Harry Potter series', ja: '『ハリー・ポッター』シリーズ全巻' },
      desc: { zh: '我超愛這個西方魔法世界，整套已經看了三次！', en: "I love this Western wizarding world — I've read the whole series three times!", ja: 'この西洋魔法の世界が大好きで、シリーズ全巻をもう3回読みました！' } },
    jinyong: { icon: '🗡️', img: null,
      role: { zh: '🗡️ 金庸武俠小說', en: '🗡️ Jin Yong wuxia novels', ja: '🗡️ 金庸の武侠小説' },
      title: { zh: '重讀第二次', en: 'Re-reading them for the second time', ja: '2回目の再読中' },
      desc: { zh: '最近又重讀了第二次。我很喜歡書裡那些勇敢又願意幫助有需要的人的英雄角色。', en: "I'm re-reading them for the second time recently. I love the brave heroes in these stories who are always willing to help people in need.", ja: '最近2回目を読み返しています。困っている人を進んで助ける勇敢なヒーローたちが登場する物語が大好きです。' } },
    movie: { icon: '🎬', img: null,
      role: { zh: '🎬 看電影、跟朋友聊天', en: '🎬 Movies & hanging out', ja: '🎬 映画鑑賞・おしゃべり' },
      title: { zh: '好動又好奇的青少年', en: 'An active, curious teenager', ja: '活発で好奇心旺盛な10代' },
      desc: { zh: '我是一個好動又好奇的青少年，很喜歡跟家人一起看電影，也喜歡跟朋友聊天、認識新朋友、看見更大的世界。', en: "I'm an active, curious teenager who loves watching movies with family and hanging out and chatting with friends, meeting new people, and seeing more of the world.", ja: '活発で好奇心旺盛な10代です。家族と映画を見たり、友達とおしゃべりしたり、新しい人と出会って広い世界を見るのが好きです。' } }
  };

  var detailMedia = document.getElementById('st-detail-media');
  var detailRole = document.getElementById('st-detail-role');
  var detailTitle = document.getElementById('st-detail-title');
  var detailDesc = document.getElementById('st-detail-desc');
  var nodes = document.querySelectorAll('.st-node');
  var activeSkill = 'karate';

  function getLang() { return window.currentLang || 'zh'; }

  function showSkill(key) {
    var s = skillData[key];
    if (!s) return;
    activeSkill = key;
    var lang = getLang();
    var title = s.title[lang] || s.title.zh;
    detailRole.textContent = s.role[lang] || s.role.zh;
    detailTitle.textContent = title;
    detailDesc.textContent = s.desc[lang] || s.desc.zh;
    detailMedia.innerHTML = s.img
      ? '<img src="' + s.img + '" alt="' + title + '">'
      : '<span>' + s.icon + '</span>';
    var oldEmbed = document.getElementById('st-detail-video');
    if (oldEmbed) oldEmbed.remove();
    if (s.igVideo) {
      var wrap = document.createElement('div');
      wrap.id = 'st-detail-video';
      wrap.style.marginTop = '14px';
      wrap.innerHTML =
        '<blockquote class="instagram-media" data-instgrm-permalink="' + s.igVideo + '" data-instgrm-version="14" style="margin:0; width:100%;"></blockquote>';
      detailDesc.insertAdjacentElement('afterend', wrap);
      if (window.instgrm && window.instgrm.Embeds) {
        window.instgrm.Embeds.process();
      }
    }
    nodes.forEach(function (n) {
      n.classList.toggle('active', n.dataset.skill === key);
    });
  }

  nodes.forEach(function (n) {
    n.addEventListener('click', function () { showSkill(n.dataset.skill); });
  });

  document.addEventListener('langchange', function () { showSkill(activeSkill); });

  showSkill('karate');
</script>
